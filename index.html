    <script>
      // Gracefully prevent browser extension injection exceptions (e.g. MetaMask in sandboxed iframe)
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? String(event.message).toLowerCase() : '';
        var src = (event && event.filename) ? String(event.filename).toLowerCase() : '';
        if (
          msg.includes('metamask') ||
          msg.includes('ethereum') ||
          msg.includes('solana') ||
          src.includes('chrome-extension') ||
          src.includes('moz-extension')
        ) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = '';
        if (typeof reason === 'string') {
          msg = reason.toLowerCase();
        } else if (reason && reason.message) {
          msg = String(reason.message).toLowerCase();
        } else if (reason && reason.stack) {
          msg = String(reason.stack).toLowerCase();
        }
        if (
          msg.includes('metamask') ||
          msg.includes('failed to connect to metamask') ||
          msg.includes('ethereum') ||
          msg.includes('solana') ||
          msg.includes('web3')
        ) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
        }
      }, true);
    </script>
